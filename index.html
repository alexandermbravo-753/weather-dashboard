<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyCast Weather Dashboard</title>
    <meta
      name="description"
      content="A modern weather dashboard powered by Open-Meteo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">☀️</div>
          <div>
            <p class="eyebrow">Weather dashboard</p>
            <h1>SkyCast</h1>
          </div>
        </div>

        <div class="toolbar">
          <button id="theme-toggle" class="toolbar-btn" type="button" aria-label="Toggle theme">
            🌙 Night
          </button>
          <button id="unit-toggle" class="toolbar-btn" type="button" aria-label="Toggle units">
            °F
          </button>
          <button id="location-btn" class="toolbar-btn accent" type="button">
            📍 My location
          </button>
        </div>
      </header>

      <form id="search-form" class="search-form" autocomplete="off">
        <label class="sr-only" for="city-input">Search city</label>
        <input
          id="city-input"
          name="city"
          type="text"
          placeholder="Search for a city"
          aria-label="Search city"
        />
        <button type="submit">Search</button>
      </form>

      <main class="dashboard">
        <section class="hero card" id="current-weather">
          <div class="hero-top">
            <div>
              <p class="section-label">Current weather</p>
              <h2 id="location-name">Loading...</h2>
            </div>
            <div class="weather-icon" id="current-icon" aria-label="Weather icon">
              ☀️
            </div>
          </div>

          <div class="hero-temp-row">
            <div class="temperature" id="current-temp">--°</div>
            <div class="weather-summary">
              <p id="weather-condition">Loading...</p>
              <p id="updated-time">--</p>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <span>Feels like</span>
              <strong id="feels-like">--°</strong>
            </div>
            <div class="stat-box">
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat-box">
              <span>Wind</span>
              <strong id="wind-speed">-- km/h</strong>
            </div>
          </div>
        </section>

        <aside class="card details-panel">
          <p class="section-label">Today</p>
          <div class="detail-item">
            <span>Sunrise</span>
            <strong id="sunrise">--:--</strong>
          </div>
          <div class="detail-item">
            <span>Sunset</span>
            <strong id="sunset">--:--</strong>
          </div>
          <div class="detail-item">
            <span>High</span>
            <strong id="day-high">--°</strong>
          </div>
          <div class="detail-item">
            <span>Low</span>
            <strong id="day-low">--°</strong>
          </div>
        </aside>
      </main>

      <section class="card hourly-panel">
        <div class="forecast-header">
          <p class="section-label">Hourly outlook</p>
        </div>
        <div id="hourly-forecast" class="hourly-forecast" aria-live="polite"></div>
      </section>

      <section class="card forecast-panel">
        <div class="forecast-header">
          <p class="section-label">7-day forecast</p>
        </div>
        <div id="forecast-grid" class="forecast-grid" aria-live="polite"></div>
      </section>
    </div>

    <template id="forecast-item-template">
      <article class="forecast-card">
        <p class="forecast-day"></p>
        <div class="forecast-icon" aria-hidden="true"></div>
        <div class="forecast-temp">
          <span class="high"></span>
          <span class="low"></span>
        </div>
      </article>
    </template>

    <template id="hourly-item-template">
      <article class="hour-card">
        <p class="hour-time"></p>
        <div class="hour-icon" aria-hidden="true"></div>
        <div class="hour-temp"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
